<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="{{ bounds.viewbox | map('round', 1) | join(' ') | default('0 0 400 200') }}"
     preserveAspectRatio="xMinYMin meet">
     {% if board is none %}
        <rect width="100%" height="100%" fill="#1a1a1a" opacity="0.1"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14" fill="gray">
            Плата не загружена
        </text>
    {% else %}
    {% endif %}
</svg>