<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GerbViewer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="pan-zoom.js"></script>
    <script src="svg-uploader.js"></script>
    <script src="panel-resizer.js"></script>
    <script src="select-elements.js"></script>
    <script src="generate-layer-panel.js"></script>
    <script src="svg-download.js"></script>
    <script src="gbr-upload.js"></script>
</head>
<body>
<div id="canvas-container">
    <div class="zoom-layer">
        <script src="svg-loader.js" data-src="BoardView.svg"></script>
    </div>
</div>
<div class="interface-layer">
    <div class="panel panel-left">
        <div class="panel-body">
            <div class="panel-title">Layers</div>
            <div class="layer-list"></div>
            <div class="upload-queue-list"></div>
        </div>
        <div class="panel-footer">
            <input type="file" id="svg-upload-input" accept=".svg" style="display: none;">
            <input type="file" id="gbr-upload-input" accept=".gbr" style="display: none;">
            <div id="gbr-upload-container" class="gbr-transform-btn">
                <div class="gbr-btn-label">Upload GBR File</div>
                <div class="gbr-btn-options">
                    <div class="gbr-option-item" data-type="SilkTop">SilkTop</div>
                    <div class="gbr-option-item" data-type="PadsTop">PadsTop</div>
                    <div class="gbr-option-item" data-type="CuTop">CuTop</div>
                    <div class="gbr-option-item" data-type="Cu">Cu</div>
                    <div class="gbr-option-item" data-type="CuBottom">CuBottom</div>
                    <div class="gbr-option-item" data-type="PadsBottom">PadsBottom</div>
                    <div class="gbr-option-item" data-type="SilkBottom">SilkBottom</div>
                    <div class="gbr-option-item" data-type="Vias">Vias</div>
                </div>
            </div>
            <button id="generate-net-btn" class="btn btn-primary">
                Generate Net and Render
            </button>
            <button id="render-svg-btn" class="btn btn-primary">
                Render Only
            </button>
            <button id="download-svg-btn" class="btn btn-primary">
                Save SVG File
            </button>
            <button id="upload-svg-btn" class="btn btn-primary">
                Upload SVG File
            </button>
        </div>
        <div class="resizer resizer-right"></div>
    </div>
    <div class="panel panel-right">
        <div class="resizer resizer-left"></div>
    </div>
</div>
</body>
</html>
