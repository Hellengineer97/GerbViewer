<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GerbViewer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="pan-zoom.js"></script>
    <script src="svg-uploader.js"></script>
    <script src="panel-resizer.js"></script>
    <script src="select-elements.js"></script>
</head>
<body>
<div id="canvas-container">
    <div class="zoom-layer">
        <script src="svg-loader.js" data-src="BoardView.svg"></script>
    </div>
</div>
<div class="interface-layer">
    <div class="panel panel-left">
        <div class="panel-content">
            <input type="file" id="svg-upload-input" accept=".svg" style="display: none;">
            <button id="upload-btn" class="btn btn-primary">
                Upload SVG File
            </button>
        </div>
        <div class="resizer resizer-right"></div>
    </div>
    <div class="panel panel-right">
        <div class="resizer resizer-left"></div>
    </div>
</div>
</body>
</html>
