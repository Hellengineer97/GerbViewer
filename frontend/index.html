<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GerbViewer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="pan-zoom.js"></script>
    <script src="svg-uploader.js"></script>
    <script src="panel-resizer.js"></script>
    <script src="select-elements.js"></script>
    <script src="generate-layer-panel.js"></script>
    <script src="svg-download.js"></script>
</head>
<body>
<div id="canvas-container">
    <div class="zoom-layer">
        <script src="svg-loader.js" data-src="BoardView.svg"></script>
    </div>
</div>
<div class="interface-layer">
    <div class="panel panel-left">
        <div class="panel-body">
            <div class="panel-title">Layers</div>
            <div class="layer-list">
                <div class="layer-row">
                    <input type="color" class="layer-color-input" value="#cc7a00">
                    <div class="layer-visible active"></div>
                    <input type="number" class="layer-number-input" value="2" min="0" max="99">
                    <div class="layer-name">Top Copper</div>
                    <div class="layer-upload" title="Upload data to layer">⭡</div>
                    <div class="layer-delete">×</div>
                </div>
                <div class="layer-row">
                    <input type="color" class="layer-color-input" value="#d4af37">
                    <div class="layer-visible"></div>
                    <input type="number" class="layer-number-input" value="1" min="0" max="99">
                    <div class="layer-name">Bottom Pads</div>
                    <div class="layer-upload" title="Upload data to layer">⭡</div>
                    <div class="layer-delete">×</div>
                </div>
            </div>
        </div>
        <div class="panel-footer">
            <input type="file" id="svg-upload-input" accept=".svg" style="display: none;">
            <button id="upload-btn" class="btn btn-primary">
                Upload SVG File
            </button>
            <button id="download-svg-btn" class="btn btn-primary">
                Download SVG File
            </button>
        </div>
        <div class="resizer resizer-right"></div>
    </div>
    <div class="panel panel-right">
        <div class="resizer resizer-left"></div>
    </div>
</div>
</body>
</html>
