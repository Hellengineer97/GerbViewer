<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>BoardViewer</title>
    <!-- 1. Подключаем стили карты прямо здесь -->
    <link rel="stylesheet" href="interface.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="map-wrapper">
        <!-- Панель для кнопок-тыкалок -->
        <div id="controls-panel" class="controls"></div>

        <!-- Наш автоматический загрузчик SVG -->
        <script src="svg-loader.js" data-src="BoardView.svg"></script>
    </div>

    <!-- 2. Подключаем внешнюю библиотеку зума/панорамирования -->
    <script src="svg-pan-zoom.min.js"></script>

    <!-- 3. Подключаем скрипт кнопок управления -->
    <script src="buttons.js"></script>

    <!-- 4. Подключаем ваш старый скрипт зажатия/логики -->
    <script type="text/javascript" src="script.js"></script>

</body>

</html>
